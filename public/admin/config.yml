backend:
  name: git-gateway
  branch: main

# Local backend option for testing offline via 'npx decap-server'
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://woodnursery.ae

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Description / Excerpt", name: "description", widget: "text" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Author", name: "author", widget: "string", default: "Wood Nursery Team" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages Content"
    files:
      - file: "src/content/pages/about.json"
        label: "About Us Page"
        name: "about"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - { label: "Main Content", name: "body", widget: "markdown" }
      - file: "src/content/pages/admissions.json"
        label: "Admissions Page"
        name: "admissions"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Process Details", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - file: "src/content/settings/general.json"
        label: "General Contact & Info"
        name: "general"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", default: "Wood Nursery" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "text" }
